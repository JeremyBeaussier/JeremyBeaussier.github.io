name: Marchés (Marché Malin)

on:
  schedule:
    - cron: "0 4 * * 1"   # chaque lundi matin
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marches
  cancel-in-progress: true

jobs:
  marches:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Liste des marchés (OpenStreetMap)
        run: python3 .github/scripts/marches.py marchemalin/marches.json
      - name: Publication
        run: |
          git config user.name "marche-malin-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marchemalin/marches.json
          git diff --cached --quiet || git commit -m "Marchés $(date -u +%F)"
          git pull --rebase -q
          git push
