name: Tendances des prix (Plein Malin)

on:
  schedule:
    - cron: "30 5 * * *"   # chaque matin, après la mise à jour de l'archive officielle
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prix-tendances
  cancel-in-progress: true

jobs:
  tendances:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calcul des tendances
        run: python3 .github/scripts/prix_tendances.py pleinmalin/data
      - name: Publication
        run: |
          git config user.name "plein-malin-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pleinmalin/data
          git diff --cached --quiet || git commit -m "Tendances des prix $(date -u +%F)"
          git push
